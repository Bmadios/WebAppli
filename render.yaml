# Blueprint Render : site statique gratuit (pas de mise en veille).
# Render > New > Blueprint > choisir le repo GitHub : ce fichier est lu automatiquement.
services:
  - type: web
    name: oiq-prep
    runtime: static
    buildCommand: echo "Aucun build requis"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      # Le service worker et les données doivent toujours être rechargés à jour
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
